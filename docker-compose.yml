# Local development stack (code mounted from the host). Production and staging
# use compose.prod.yml and deploy/deploy.sh instead.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: wfm_app
    restart: no
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      - CONTAINER_ROLE=app
    depends_on:
      - db
      - redis
    networks:
      - wfm

  webserver:
    image: nginx:1.27-alpine
    container_name: wfm_webserver
    restart: no
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - wfm

  db:
    image: postgres:16-alpine
    container_name: wfm_db
    restart: no
    environment:
      POSTGRES_DB: ${DB_DATABASE:-wfm_duty_matrix}
      POSTGRES_USER: ${DB_USERNAME:-wfm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wfm_secret}
    volumes:
      - wfm_pg_data:/var/lib/postgresql/data
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    networks:
      - wfm

  redis:
    image: redis:7-alpine
    container_name: wfm_redis
    restart: no
    volumes:
      - wfm_redis_data:/data
    networks:
      - wfm

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: wfm_worker
    restart: no
    working_dir: /var/www
    command: php artisan queue:work redis --tries=3 --sleep=2
    volumes:
      - ./:/var/www
    environment:
      - CONTAINER_ROLE=worker
    depends_on:
      - app
      - redis
      - db
    networks:
      - wfm

networks:
  wfm:
    driver: bridge

volumes:
  wfm_pg_data:
  wfm_redis_data:
